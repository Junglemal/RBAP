#    container_name: chromadb
#    restart: unless-stopped
#    volumes:
#      - ./chroma-data:/data
#    ports:
#      - "8000:8000"
#    environment:
#      - IS_PERSISTENT=TRUE
#    depends_on:
#      db:
#        condition: service_started
#      rabbitmq:
#        condition: service_healthy
#    networks:
