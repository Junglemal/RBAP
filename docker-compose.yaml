  ui:
    build:
      context: .
      dockerfile: dockerfile.st
    container_name: streamlit
    depends_on:
      - app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://app:8080
    volumes:
      - ./streamlit:/app
    networks:
      - rbap-network

volumes:
  rabbitmq_data:
  postgres_data:
  ollama_data:
  chroma_data:

networks:
  rbap-network:
    name: rbap-network
    driver: bridge
